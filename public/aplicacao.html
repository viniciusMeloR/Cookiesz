<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style/style.css">

    <title>Maple Storage | Minhas Anotações</title>

</head>


<body class="homepage">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">


        <div class="logo-area">

            <div class="logo">

                <span class="logo-mapa">
                    Maple
                </span>

                <span class="logo-story">
                    Storage
                </span>

            </div>


            <span class="logo-subtitulo">
                Seu conhecimento, seu mapa.
            </span>

        </div>


        <div class="botoes">

            <span id="nomeUsuario" class="usuario-logado">

            </span>


            <button class="botao-header" onclick="sair()">

                Sair

            </button>

        </div>


    </header>



    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="conteudo">


        <!-- =================================================
             BANNER
        ================================================== -->

        <section class="banner">


            <div class="banner-conteudo">




                <h1>
                    Minhas anotações
                </h1>


            </div>


        </section>



        <!-- =================================================
             PAINEL CRUD
        ================================================== -->

        <section class="painel">


            <!-- =============================================
                 TOPO DO PAINEL
            ============================================== -->

            <div class="painel-topo">


                <div>

                    <h2>
                        Minhas anotações
                    </h2>

                </div>


                <button class="botao-criar" onclick="abrirModalAnotacao()">

                    ＋ Nova anotação

                </button>


            </div>



            <!-- =============================================
                 FILTROS
            ============================================== -->

            <div class="filtros">


                <div class="campo-pesquisa">


                    <span>
                        🔎
                    </span>


                    <input type="text" id="inputPesquisa" placeholder="Pesquisar anotação..."
                     oninput="filtrarAnotacoes()">


                </div>



                <select id="filtroCategoria" onchange="filtrarAnotacoes()">


                    <option value="">
                        Todas as categorias
                    </option>


                    <option value="Frontend">
                        Frontend
                    </option>


                    <option value="Backend">
                        Backend
                    </option>


                    <option value="Cloud">
                        Cloud
                    </option>


                    <option value="Banco de Dados">
                        Banco de Dados
                    </option>


                    <option value="DevOps">
                        DevOps
                    </option>


                </select>


            </div>


            <div id="containerAnotacoes" class="anotacoes">
            </div>



            <div id="semAnotacoes" class="sem-anotacoes" style="display: none;">


                <div class="icone-vazio">

                    🍁

                </div>


                <h3>
                    Nenhuma anotação encontrada
                </h3>


                <p>
                    Sua jornada ainda está começando.
                    <br>
                    Crie sua primeira anotação e registre
                    seus conhecimentos.
                </p>


                <button class="botao-modal" onclick="abrirModalAnotacao()">

                    ＋ Criar primeira anotação

                </button>


            </div>


        </section>


    </main>



    <!-- =====================================================
         MODAL — CRIAR / EDITAR
    ====================================================== -->

    <dialog id="modalAnotacao">


        <div class="estiloModal">


            <!-- =============================================
                 BOTÃO FECHAR
            ============================================== -->

            <button class="fechar" onclick="fecharModalAnotacao()">

                ×

            </button>



            <!-- =============================================
                 ÍCONE
            ============================================== -->

            <div class="modal-icone">

                🍁

            </div>



            <!-- =============================================
                 TÍTULO
            ============================================== -->

            <h1 id="tituloModal">

                Nova anotação

            </h1>



            <p class="modal-subtitulo">

                Registre algo novo que você aprendeu.

            </p>



            <!-- =============================================
                 TÍTULO DA ANOTAÇÃO
            ============================================== -->

            <label for="tituloAnotacao">

                Título

            </label>


            <input type="text" id="tituloAnotacao" placeholder="Ex: Como funciona uma EC2">



            <!-- =============================================
                 CATEGORIA
            ============================================== -->

            <label for="categoriaAnotacao">

                Categoria

            </label>


            <select id="categoriaAnotacao">


                <option value="">
                    Selecione uma categoria
                </option>


                <option value="Frontend">
                    Frontend
                </option>


                <option value="Backend">
                    Backend
                </option>


                <option value="Cloud">
                    Cloud
                </option>


                <option value="Banco de Dados">
                    Banco de Dados
                </option>


                <option value="DevOps">
                    DevOps
                </option>


            </select>



            <!-- =============================================
                 TECNOLOGIA
            ============================================== -->

            <label for="tecnologiaAnotacao">

                Tecnologia

            </label>


            <input type="text" id="tecnologiaAnotacao" placeholder="Ex: AWS, JavaScript, MySQL...">



            <!-- =============================================
                 CONTEÚDO
            ============================================== -->

            <label for="conteudoAnotacao">

                Conteúdo

            </label>


            <textarea id="conteudoAnotacao" placeholder="Escreva aqui o que você aprendeu..."></textarea>



            <!-- =============================================
                 SALVAR
            ============================================== -->

            <button class="botao-modal" onclick="salvarAnotacao()">

                Salvar anotação

            </button>


        </div>


    </dialog>
    <dialog id="modalExcluir">
        <div class="conteudo-modal-excluir">
        <h1>Deseja excluir essa anotação?</h1>
        <button class ="botao-modal" onclick="excluirAnotacao()">SIM</button>
        <button class ="botao-modal" onclick="fecharModalExcluir()">NÃO</button>
        </div>
    </dialog>

</body>

</html>

<script>
    let listaAnotacoes = [];
    let modoModal = "criar";
    let idAnotacaoEditando = null;
    let idAnotacaoExcluir = null;
    let nome = document.getElementById("nomeUsuario")
    let nomeUsuario = sessionStorage.NOME_USUARIO;
    nome.innerHTML = `${nomeUsuario}`


    // Quando a página carregar
    window.onload = function () {
        buscarAnotacoes();
    };


    function filtrarAnotacoes() {

    let textoPesquisa =
        document.getElementById("inputPesquisa").value.toLowerCase();

    let categoriaSelecionada =
        document.getElementById("filtroCategoria").value;

    let resultado = listaAnotacoes.filter(function (anotacao) {

        let correspondePesquisa =
            anotacao.tituloAnotacao
                .toLowerCase()
                .includes(textoPesquisa) ||

            anotacao.conteudoAnotacao
                .toLowerCase()
                .includes(textoPesquisa) ||

            anotacao.tecnologiaAnotacao
                .toLowerCase()
                .includes(textoPesquisa);

        let correspondeCategoria =
            categoriaSelecionada === "" ||
            anotacao.categoriaAnotacao === categoriaSelecionada;

        return correspondePesquisa && correspondeCategoria;

    });

    criarCards(resultado);
}

    function buscarAnotacoes() {
        let idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/anotacoes/buscarTodas/${idUsuario}`)
            .then(function (resposta) {

                if (resposta.ok) {
                    return resposta.json();
                }

                throw new Error("Erro ao buscar anotações");

            })
            .then(function (anotacoes) {

                console.log("Anotações recebidas:", anotacoes);
                listaAnotacoes = anotacoes;
                criarCards(anotacoes);

            })
            .catch(function (erro) {

                console.log("Erro:", erro);

            });
    }


    // ======================================================
    // CRIAR OS CARDS NA TELA
    // ======================================================

    function criarCards(anotacoes) {

        let container = document.getElementById("containerAnotacoes");

        let mensagemSemAnotacoes =
            document.getElementById("semAnotacoes");


        // Limpa os cards antigos
        container.innerHTML = "";


        // Se não tiver nenhuma anotação
        if (anotacoes.length == 0) {

            mensagemSemAnotacoes.style.display = "block";

            return;
        }


        // Se tiver anotações, esconde a mensagem
        mensagemSemAnotacoes.style.display = "none";


        // Percorre todas as anotações
        for (let i = 0; i < anotacoes.length; i++) {

            let anotacao = anotacoes[i];


            container.innerHTML += `
        
            <div class="card-anotacao">

                <div class="card-topo">

                    <span class="categoria">
                        ${anotacao.categoriaAnotacao}
                    </span>


                    <div class="acoes">

                        <button
                            class="botao-editar"
                            onclick="abrirModalEdicao(${anotacao.idAnotacao})">
                            ✏️
                        </button>


                       <button class="botao-excluir"
                            onclick="abrirModalExcluir(${anotacao.idAnotacao})">
                                 🗑️
                        </button>

                    </div>

                </div>


                <h3>
                    ${anotacao.tituloAnotacao}
                </h3>


                <p class="descricao">
                    ${anotacao.conteudoAnotacao}
                </p>


                <div class="card-rodape">

                    <span>
                        ${anotacao.tecnologiaAnotacao}
                    </span>

                </div>

            </div>

        `;
        }
    }


    // ======================================================
    // ABRIR MODAL PARA CRIAR
    // ======================================================

    function abrirModalAnotacao() {

        // Define que o modal está no modo criação
        modoModal = "criar";

        // Não existe anotação sendo editada
        idAnotacaoEditando = null;


        // Altera o título do modal
        document.getElementById("tituloModal").innerText =
            "Nova anotação";


        // Limpa os campos
        document.getElementById("tituloAnotacao").value = "";

        document.getElementById("categoriaAnotacao").value = "";

        document.getElementById("tecnologiaAnotacao").value = "";

        document.getElementById("conteudoAnotacao").value = "";


        // Abre o modal
        document.getElementById("modalAnotacao").showModal();
    }


    // ======================================================
    // ABRIR MODAL PARA EDITAR
    // ======================================================

    function abrirModalEdicao(idAnotacao) {

        // Define que estamos editando
        modoModal = "editar";

        // Guarda o ID da anotação
        idAnotacaoEditando = idAnotacao;


        // Altera o título do modal
        document.getElementById("tituloModal").innerText =
            "Editar anotação";


        // Busca a anotação pelo ID
        fetch(`/anotacoes/buscar/${idAnotacao}`)

            .then(function (resposta) {

                if (resposta.ok) {
                    return resposta.json();
                }

                throw new Error("Erro ao buscar anotação");

            })

            .then(function (resultado) {
                let anotacao = resultado[0];
                console.log("Anotação encontrada:", anotacao);


                // Coloca os dados da anotação dentro do modal
                document.getElementById("tituloAnotacao").value =
                    anotacao.tituloAnotacao;


                document.getElementById("categoriaAnotacao").value =
                    anotacao.categoriaAnotacao;


                document.getElementById("tecnologiaAnotacao").value =
                    anotacao.tecnologiaAnotacao;


                document.getElementById("conteudoAnotacao").value =
                    anotacao.conteudoAnotacao;


                // Depois de preencher os campos, abre o modal
                document.getElementById("modalAnotacao").showModal();

            })

            .catch(function (erro) {

                console.log("Erro:", erro);

            });
    }


    // ======================================================
    // BOTÃO SALVAR DO MODAL
    // ======================================================

    function salvarAnotacao() {

        // Verifica qual é o modo atual do modal

        if (modoModal == "criar") {

            cadastrarAnotacao();

        } else {

            editarAnotacao();

        }
    }


    // ======================================================
    // CADASTRAR ANOTAÇÃO
    // ======================================================

    function cadastrarAnotacao() {

        // Pega os valores dos inputs
        let idUsuario = sessionStorage.ID_USUARIO;

        let tituloAnotacao =
            document.getElementById("tituloAnotacao").value;


        let categoriaAnotacao =
            document.getElementById("categoriaAnotacao").value;


        let tecnologiaAnotacao =
            document.getElementById("tecnologiaAnotacao").value;


        let conteudoAnotacao =
            document.getElementById("conteudoAnotacao").value;


        // Envia para o backend
        fetch("/anotacoes/cadastrar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                tituloAnotacaoServer:
                    tituloAnotacao,

                categoriaAnotacaoServer:
                    categoriaAnotacao,

                tecnologiaAnotacaoServer:
                    tecnologiaAnotacao,

                conteudoAnotacaoServer:
                    conteudoAnotacao,

                idUsuarioServer: idUsuario
            })

        })

            .then(function (resposta) {

                if (resposta.ok) {
                    return resposta.json();
                }

                throw new Error("Erro ao cadastrar anotação");

            })

            .then(function (resultado) {

                console.log(
                    "Anotação cadastrada:",
                    resultado
                );


                // Fecha o modal
                fecharModalAnotacao();


                // Busca novamente as anotações
                buscarAnotacoes();

            })

            .catch(function (erro) {

                console.log("Erro:", erro);

            });
    }


    // ======================================================
    // EDITAR ANOTAÇÃO
    // ======================================================

    function editarAnotacao() {

        // Pega os valores dos inputs
        let idUsuario = sessionStorage.ID_USUARIO;
        let tituloAnotacao =
            document.getElementById("tituloAnotacao").value;


        let categoriaAnotacao =
            document.getElementById("categoriaAnotacao").value;


        let tecnologiaAnotacao =
            document.getElementById("tecnologiaAnotacao").value;


        let conteudoAnotacao =
            document.getElementById("conteudoAnotacao").value;


        // Envia os dados para o backend
        fetch(`/anotacoes/editar/${idAnotacaoEditando}`, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                idUsuarioServer: idUsuario,

                tituloAnotacaoServer:
                    tituloAnotacao,

                categoriaAnotacaoServer:
                    categoriaAnotacao,

                tecnologiaAnotacaoServer:
                    tecnologiaAnotacao,

                conteudoAnotacaoServer:
                    conteudoAnotacao

            })

        })

            .then(function (resposta) {

                if (resposta.ok) {
                    return resposta.json();
                }

                throw new Error("Erro ao editar anotação");

            })

            .then(function (resultado) {

                console.log(
                    "Anotação editada:",
                    resultado
                );


                // Fecha o modal
                fecharModalAnotacao();


                // Atualiza os cards
                buscarAnotacoes();

            })

            .catch(function (erro) {

                console.log("Erro:", erro);

            });
    }


    // ======================================================
    // FECHAR MODAL
    // ======================================================

    function fecharModalAnotacao() {

        document
            .getElementById("modalAnotacao")
            .close();
    }
    function abrirModalExcluir(idAnotacao) {

        idAnotacaoExcluir = idAnotacao;
        document.getElementById("modalExcluir").showModal();
    }
    function fecharModalExcluir() {
        document.getElementById("modalExcluir").close();

        idAnotacaoExcluir = null;
    }
    function excluirAnotacao() {
        let idUsuario = sessionStorage.ID_USUARIO;
        fetch(`/anotacoes/deletar/${idAnotacaoExcluir}`, {

            method: "DELETE",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                idUsuarioServer: idUsuario,
            })

        })

            .then(function (resposta) {

                if (resposta.ok) {
                    return resposta.json();
                }

                throw new Error("Erro ao excluir anotação");

            })

            .then(function (resultado) {

                console.log(
                    "Anotação excluida:",
                    resultado
                );
                  fecharModalExcluir();

                idAnotacaoExcluir = null;
                buscarAnotacoes();

            })

            .catch(function (erro) {

                console.log("Erro:", erro);

            });


    }

    function sair() {

        sessionStorage.clear();

        window.location = "../public/index.html";
    }

</script>
